<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch C/C++</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236c5ce7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/%3E%3Cpath d='M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12'/%3E%3C/svg%3E">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <style>
        /* ==================== 主题变量 ==================== */
        :root {
            /* 背景层 */
            --bg-root: #1e1e2f;
            --bg-toolbar: #2a2a3c;
            --bg-toolbar-2: #262636;
            --bg-panel: #252538;
            --bg-panel-header: #2a2a3c;
            --bg-elevated: #2f2f4a;
            --bg-elevated-hover: #44446a;
            --bg-gutter: #1a1a2a;
            --bg-input: #1e1e2f;
            --bg-modal: #2a2a3c;
            --bg-block: #252538;
            --bg-block-hover: #3d3d5e;
            --bg-cat-header: #3a3a55;
            --bg-hover-soft: #5a5a8a;

            /* 按钮 */
            --btn-bg: #3a3a55;
            --btn-bg-hover: #4d4d73;
            --btn-border: #555577;
            --btn-text: #eee;
            --btn-text-hover: #fff;

            /* 边框 */
            --border: #3e3e55;
            --border-input: #444466;

            /* 文字 */
            --text-primary: #eee;
            --text-strong: #ddd;
            --text-secondary: #ccc;
            --text-muted: #aaa;
            --text-dim: #888;
            --text-faint: #666;
            --text-weak: #bbb;

            /* 强调色 */
            --accent: #6c5ce7;
            --accent-hover: #7f6ff0;
            --accent-light: #8e7dff;
            --accent-soft: #c9c2ff;
            --accent-2: #9b59b6;
            --accent-3: #3498db;
            --active-soft-bg: rgba(108, 92, 231, 0.22);
            --heading: #a29bfe;
            --hint: #9b59b6;
            --success: #00b894;

            /* 危险色 */
            --danger: #ff7675;
            --danger-text: #ffb3b3;
            --danger-bg: #6a2a3a;
            --danger-border: #8a3a4a;
            --danger-hover: #8a3a4a;
            --danger-border-soft: #6a3a3a;
            --danger-hover-soft: #5a2a2a;

            /* 编辑器 */
            --caret: #fff;
            --selection-bg: rgba(108, 92, 231, 0.45);
            --search-bg: rgba(253, 203, 110, 0.35);
            --search-bg-current: rgba(253, 203, 110, 0.85);
            --search-ring: rgba(253, 203, 110, 0.9);
            --gutter-text: #666;
            --gutter-current: #fff;

            /* 语法高亮 */
            --tok-keyword: #cf8e6d;
            --tok-macro: #cf8e6d;
            --tok-string: #6aab73;
            --tok-char: #a6e22e;
            --tok-number: #2aacb8;
            --tok-boolean: #ae81ff;
            --tok-comment: #7a7e85;
            --tok-func: #56a8f5;
            --tok-op: #a9b7c6;

            /* 子组标签 */
            --sub-c-bg: #1a3a5a;
            --sub-c-fg: #74b9ff;
            --sub-cpp-bg: #1a3a5a;
            --sub-cpp-fg: #a29bfe;
            --sub-custom-bg: #3a3a2a;
            --sub-custom-fg: #fdcb6e;

            /* 滚动条 */
            --scroll-thumb: #4d4d73;
            --scroll-thumb-hover: #6c5ce7;
            --scroll-track: #1e1e2f;

            /* 阴影与遮罩 */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.7);
            --overlay-bg: rgba(0, 0, 0, 0.6);

            /* Logo 渐变 */
            --logo-1: #9b59b6;
            --logo-2: #3498db;
        }

        html[data-theme="light"] {
            --bg-root: #f4f6f9;
            --bg-toolbar: #ffffff;
            --bg-toolbar-2: #fbfcfd;
            --bg-panel: #ffffff;
            --bg-panel-header: #fafbfd;
            --bg-elevated: #f4f6fa;
            --bg-elevated-hover: #e9edf5;
            --bg-gutter: #edf0f5;
            --bg-input: #ffffff;
            --bg-modal: #ffffff;
            --bg-block: #ffffff;
            --bg-block-hover: #eef1f8;
            --bg-cat-header: #eef1f7;
            --bg-hover-soft: #e3e8f2;

            --btn-bg: #f4f6fa;
            --btn-bg-hover: #e7ebf3;
            --btn-border: #d5dbe6;
            --btn-text: #2b2f38;
            --btn-text-hover: #14171d;

            --border: #e2e6ee;
            --border-input: #d8dee9;

            --text-primary: #1f2430;
            --text-strong: #2b3038;
            --text-secondary: #4b5261;
            --text-muted: #6b7280;
            --text-dim: #8a929f;
            --text-faint: #a9b1bd;
            --text-weak: #5c6472;

            --accent: #6c5ce7;
            --accent-hover: #5b4bd6;
            --accent-light: #7f6ff0;
            --accent-soft: #5a4ddb;
            --accent-2: #8e44ad;
            --accent-3: #2b7cd3;
            --active-soft-bg: rgba(108, 92, 231, 0.12);
            --heading: #6c5ce7;
            --hint: #7b4fa8;
            --success: #0a9c78;

            --danger: #d93a3f;
            --danger-text: #b8262b;
            --danger-bg: #ffecec;
            --danger-border: #f2c3c4;
            --danger-hover: #ffdede;
            --danger-border-soft: #f3c9c9;
            --danger-hover-soft: #ffe4e4;

            --caret: #1f2430;
            --selection-bg: rgba(108, 92, 231, 0.22);
            --search-bg: rgba(255, 196, 0, 0.55);
            --search-bg-current: rgba(255, 170, 0, 0.85);
            --search-ring: rgba(255, 150, 0, 0.95);
            --gutter-text: #9aa3b0;
            --gutter-current: #1f2430;

            --tok-keyword: #a626a4;
            --tok-macro: #c1613c;
            --tok-string: #50a14f;
            --tok-char: #50a14f;
            --tok-number: #986801;
            --tok-boolean: #986801;
            --tok-comment: #a0a1a7;
            --tok-func: #4078f2;
            --tok-op: #383a42;

            --sub-c-bg: #e4f0fd;
            --sub-c-fg: #1a73c9;
            --sub-cpp-bg: #eee9ff;
            --sub-cpp-fg: #6b4ee6;
            --sub-custom-bg: #fff3d6;
            --sub-custom-fg: #a06a00;

            --scroll-thumb: #c9d0dc;
            --scroll-thumb-hover: #a9b2c0;
            --scroll-track: #eef1f6;

            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 16px 48px rgba(15, 23, 42, 0.16);
            --overlay-bg: rgba(15, 23, 42, 0.38);

            --logo-1: #8e44ad;
            --logo-2: #2b7cd3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-root);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            transition: background-color 0.18s ease, color 0.18s ease;
        }

        .icon {
            width: 1em;
            height: 1em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: -0.125em;
            display: inline-block;
            flex-shrink: 0;
        }

        .toolbar {
            background: var(--bg-toolbar);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }
        .toolbar.toolbar-second {
            padding-top: 6px;
            padding-bottom: 6px;
            border-top: none;
            box-shadow: none;
            background: var(--bg-toolbar-2);
        }

        .toolbar .logo {
            font-weight: 700;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--logo-1), var(--logo-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar .logo .icon { color: var(--text-strong); -webkit-text-fill-color: initial; }

        .toolbar button {
            background: var(--btn-bg);
            border: none;
            color: var(--btn-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            border: 1px solid var(--btn-border);
        }

        .toolbar button:hover {
            background: var(--btn-bg-hover);
            border-color: var(--accent-2);
            transform: translateY(-1px);
        }

        .toolbar button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .toolbar button.icon-only { padding: 6px 10px; }
        .toolbar .spacer { flex: 1; }
        .toolbar .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

        .main-container { display: flex; flex: 1; overflow: hidden; gap: 8px; padding: 8px; }

        .blocks-panel {
            width: 280px;
            background: var(--bg-panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        .blocks-panel-header {
            padding: 8px 10px;
            background: var(--bg-panel-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .blocks-panel-header .row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .blocks-panel-header input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
        }

        .blocks-panel-header label {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
        }
        .blocks-panel-header label .icon { color: var(--text-strong); }

        .panel-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-secondary);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.72rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
            white-space: nowrap;
        }
        .panel-btn svg.icon { color: var(--text-secondary); }
        .panel-btn:hover { background: var(--btn-bg-hover); color: var(--btn-text-hover); }
        .panel-btn:hover svg.icon { color: var(--btn-text-hover); }
        .panel-btn.icon-only { padding: 4px 7px; }
        .panel-btn.danger { color: var(--danger); border-color: var(--danger-border-soft); }
        .panel-btn.danger svg.icon { color: var(--danger); }
        .panel-btn.danger:hover { background: var(--danger-hover-soft); }
        .panel-btn.danger:hover svg.icon { color: var(--btn-text-hover); }
        .panel-btn.active { background: var(--accent); color: #fff; border-color: var(--accent-light); }
        .panel-btn.active svg.icon { color: #fff; }

        .blocks-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .category {
            margin-bottom: 6px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        .category-header {
            padding: 6px 8px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-strong);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            background: var(--bg-cat-header);
        }

        .category-header:hover { background: var(--bg-elevated-hover); }
        .category-header .cat-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .category-header .arrow { font-size: 0.7rem; transition: transform 0.2s; color: var(--text-strong); stroke-width: 2.2; }
        .category.collapsed .arrow { transform: rotate(-90deg); }
        .category.collapsed .category-body { display: none; }
        .category-header .cat-icon { color: var(--text-strong); stroke-width: 2.2; }

        .cat-add-btn, .cat-reorder-btn {
            background: transparent;
            border: none;
            color: var(--text-strong);
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
        }
        .cat-add-btn:hover, .cat-reorder-btn:hover { background: var(--bg-hover-soft); color: var(--btn-text-hover); }
        .cat-reorder-btn { color: var(--text-strong); }

        .category-body { padding: 4px 6px 6px; }

        .subgroup-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 2px 6px;
            margin: 4px 0 2px;
            border-radius: 4px;
            display: inline-block;
        }
        .subgroup-label.c { background: var(--sub-c-bg); color: var(--sub-c-fg); }
        .subgroup-label.cpp { background: var(--sub-cpp-bg); color: var(--sub-cpp-fg); }
        .subgroup-label.custom { background: var(--sub-custom-bg); color: var(--sub-custom-fg); }

        .block {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 6px;
            margin: 2px 0;
            border-radius: 6px;
            background: var(--bg-block);
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.12s;
            border: 1px solid transparent;
            position: relative;
        }

        .block:hover {
            background: var(--bg-block-hover);
            border-color: var(--accent);
        }

        .block .block-icon {
            color: var(--text-strong);
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            stroke-width: 2.2;
        }

        .block .block-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Courier New', monospace;
            color: var(--text-strong);
            font-size: 0.72rem;
        }

        .block .block-mode {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 0.62rem;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .block .block-mode input[type="checkbox"] {
            accent-color: var(--accent);
            cursor: pointer;
            margin: 0;
            width: 12px;
            height: 12px;
        }

        .block-reorder-btns {
            display: flex;
            gap: 1px;
            flex-shrink: 0;
        }
        .block-reorder-btns button {
            background: transparent;
            border: none;
            color: var(--text-strong);
            cursor: pointer;
            padding: 1px 3px;
            font-size: 0.65rem;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
        }
        .block-reorder-btns button:hover { background: var(--bg-hover-soft); color: var(--btn-text-hover); }

        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-root);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        .editor-header {
            background: var(--bg-panel-header);
            padding: 4px 12px;
            font-size: 0.85rem;
            color: var(--text-weak);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            gap: 8px;
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        .editor-header .title-area {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .editor-header .title-area .icon {
            color: var(--text-strong);
            flex-shrink: 0;
        }

        #titleInput {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-strong);
            font-size: 0.85rem;
            padding: 2px 6px;
            border-radius: 4px;
            outline: none;
            font-family: 'Courier New', monospace;
            width: 160px;
            transition: 0.15s;
        }
        #titleInput:hover { background: var(--bg-input); }
        #titleInput:focus { background: var(--bg-input); border-color: var(--accent); }

        .editor-header .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .header-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.12s;
        }
        .header-btn svg.icon { color: var(--text-secondary); }
        .header-btn:hover { background: var(--btn-bg); color: var(--btn-text-hover); border-color: var(--btn-border); }
        .header-btn:hover svg.icon { color: var(--btn-text-hover); }
        .header-btn.active {
            background: var(--active-soft-bg);
            color: var(--accent-soft);
            border-color: var(--accent);
        }
        .header-btn.active svg.icon { color: var(--accent-soft); }

        .editor-header #cursorPos {
            font-size: 0.72rem;
            color: var(--text-dim);
            flex-shrink: 0;
            margin-left: 4px;
        }

        .search-bar {
            background: var(--bg-panel-header);
            border-bottom: 1px solid var(--border);
            padding: 6px 12px;
            display: none;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 0.8rem;
        }
        .search-bar.show { display: flex; }
        .search-bar input[type="text"] {
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 4px 8px;
            font-size: 0.8rem;
            outline: none;
            width: 140px;
            font-family: 'Courier New', monospace;
        }
        .search-bar input[type="text"]:focus { border-color: var(--accent); }
        .search-bar .opt-btn {
            background: transparent;
            border: 1px solid var(--border-input);
            color: var(--text-muted);
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: 0.12s;
        }
        .search-bar .opt-btn:hover { border-color: var(--accent-2); color: var(--btn-text-hover); }
        .search-bar .opt-btn.active { background: var(--accent); color: #fff; border-color: var(--accent-light); }
        .search-bar .search-count {
            font-size: 0.72rem;
            color: var(--text-dim);
            min-width: 70px;
            text-align: center;
        }
        .search-bar .nav-btn, .search-bar .close-btn, .search-bar .replace-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-secondary);
            border-radius: 5px;
            padding: 3px 7px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: 0.12s;
            display: inline-flex;
            align-items: center;
        }
        .search-bar .nav-btn svg.icon, .search-bar .close-btn svg.icon { color: var(--text-secondary); }
        .search-bar .nav-btn:hover, .search-bar .close-btn:hover, .search-bar .replace-btn:hover { background: var(--btn-bg-hover); color: var(--btn-text-hover); }
        .search-bar .nav-btn:hover svg.icon, .search-bar .close-btn:hover svg.icon { color: var(--btn-text-hover); }
        .search-bar .replace-group { display: none; align-items: center; gap: 6px; }
        .search-bar.show-replace .replace-group { display: flex; }
        .search-bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

        .code-editor { flex: 1; position: relative; overflow: hidden; background: var(--bg-root); transition: background-color 0.18s ease; }

        .highlight-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .highlight-layer pre {
            margin: 0;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 24px;
            letter-spacing: 0;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            word-wrap: normal;
            overflow: visible;
            color: var(--text-strong);
            background: transparent;
            border: none;
            min-width: 100%;
            box-sizing: border-box;
        }

        .highlight-layer pre code {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            letter-spacing: inherit;
            tab-size: inherit;
            white-space: pre;
            background: transparent !important;
            text-shadow: none !important;
            padding: 0;
            margin: 0;
        }

        .search-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }

        .search-layer pre {
            margin: 0;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 24px;
            letter-spacing: 0;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            word-wrap: normal;
            overflow: visible;
            color: transparent;
            -webkit-text-fill-color: transparent;
            background: transparent;
            border: none;
            min-width: 100%;
            box-sizing: border-box;
        }

        .search-layer pre code {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            letter-spacing: inherit;
            tab-size: inherit;
            white-space: pre;
            background: transparent !important;
            text-shadow: none !important;
            padding: 0;
            margin: 0;
        }

        .search-layer .search-match {
            background: var(--search-bg);
            border-radius: 2px;
        }

        .search-layer .search-match.current {
            background: var(--search-bg-current);
            box-shadow: 0 0 0 1px var(--search-ring);
        }

        #codeInput {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            margin: 0;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 24px;
            letter-spacing: 0;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            word-wrap: normal;
            background: transparent;
            color: transparent;
            caret-color: var(--caret);
            border: none;
            outline: none;
            resize: none;
            overflow: auto;
            box-sizing: border-box;
            z-index: 3;
            -webkit-text-fill-color: transparent;
            wrap: off;
        }

        #codeInput::selection {
            background: var(--selection-bg);
            -webkit-text-fill-color: transparent;
        }

        #codeInput::placeholder {
            color: var(--text-faint);
            -webkit-text-fill-color: var(--text-faint);
        }

        /* ==================== 行号列 ==================== */
        .line-numbers {
            position: absolute;
            top: 0; left: 0;
            width: 40px;
            height: 100%;
            overflow: hidden;
            background: var(--bg-gutter);
            border-right: 1px solid var(--border);
            z-index: 4;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            display: none;
            box-sizing: border-box;
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        .code-editor.show-ln .line-numbers { display: block; }

        .ln-inner {
            padding: 16px 8px 16px 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 24px;
            letter-spacing: 0;
            tab-size: 4;
            -moz-tab-size: 4;
            text-align: right;
            color: var(--gutter-text);
            white-space: nowrap;
            will-change: transform;
            box-sizing: border-box;
        }

        .ln-row {
            height: 24px;
            line-height: 24px;
            transition: color 0.1s;
        }

        .ln-row.current {
            color: var(--gutter-current);
            font-weight: bold;
        }

        /* 行号显示时，三层（高亮层 / 查找层 / textarea）同步让出左侧空间 */
        .code-editor.show-ln #codeInput,
        .code-editor.show-ln .highlight-layer pre,
        .code-editor.show-ln .search-layer pre {
            padding-left: calc(16px + var(--ln-width, 40px) + 8px);
        }

        /* ---------- 语法高亮（不依赖 Prism 主题 CSS，随主题变量切换） ---------- */
        .highlight-layer .token.comment { color: var(--tok-comment); font-style: italic; }
        .highlight-layer .token.string { color: var(--tok-string); }
        .highlight-layer .token.char { color: var(--tok-char); }
        .highlight-layer .token.number { color: var(--tok-number); }
        .highlight-layer .token.boolean { color: var(--tok-boolean); }
        .highlight-layer .token.keyword { color: var(--tok-keyword); }
        .highlight-layer .token.function,
        .highlight-layer .token.class-name { color: var(--tok-func); }
        .highlight-layer .token.operator,
        .highlight-layer .token.punctuation { color: var(--tok-op); }
        /* 预处理指令：#include / #define 整行 */
        .highlight-layer .token.macro,
        .highlight-layer .token.macro-name,
        .highlight-layer .token.directive,
        .highlight-layer .token.directive-hash { color: var(--tok-macro); }
        /* macro.property 是 Prism 给整行包的外层，不能着色，否则覆盖内部 token */
        .highlight-layer .token.macro.property { color: inherit; }
        .highlight-layer .token.expression { color: inherit; }
        .highlight-layer .token.namespace { color: var(--tok-func); }

        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

        .status-bar {

        .drag-over { outline: 2px dashed var(--accent-light); outline-offset: -2px; }

        .modal-overlay {

        .modal {

            display: flex;
            flex-direction: column;
            gap: 12px;

            color: var(--heading);

        }
        .modal h3 .icon { color: var(--text-strong); }
        .modal .field { display: flex; flex-direction: column; gap: 5px; }

            font-size: 0.72rem; color: var(--text-muted);

        }
        .modal .field input[type="text"],

            border: 1px solid var(--border-input);

            font-size: 0.85rem;
            outline: none;
        }
        .modal .field textarea { resize: vertical; min-height: 80px; }
        .modal .field input:focus, .modal .field textarea:focus, .modal .field select:focus { border-color: var(--accent); }
        .modal .radio-group { display: flex; gap: 12px; }
        .modal .radio-group label {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;
            text-transform: none; letter-spacing: 0;
        }
        .modal .radio-group input[type="radio"] { accent-color: var(--accent); cursor: pointer; }
        .modal .hint { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }
        .modal .modal-actions {
            display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px;
            align-items: center;
        }
        .modal .modal-actions button {
            padding: 7px 16px; border-radius: 8px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg); color: var(--btn-text);
            font-size: 0.82rem; cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .modal .modal-actions button svg.icon { color: var(--text-secondary); }
        .modal .modal-actions button:hover { background: var(--btn-bg-hover); }
        .modal .modal-actions button:hover svg.icon { color: var(--btn-text-hover); }
        .modal .modal-actions button.primary { background: var(--accent); border-color: var(--accent-light); color: #fff; }
        .modal .modal-actions button.primary svg.icon { color: #fff; }
        .modal .modal-actions button.primary:hover { background: var(--accent-hover); }
        .modal .modal-actions button.danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
        .modal .modal-actions button.danger svg.icon { color: var(--danger-text); }
        .modal .modal-actions button.danger:hover { background: var(--danger-hover); }

        .block-picker {
            position: fixed;
            z-index: 1500;
            width: 460px;
            max-width: 92vw;

            border: 1px solid var(--border);

        .block-picker-header input::placeholder { color: var(--text-faint); }

        .block-picker-list {
            max-height: 320px;
            min-height: 44px;
            overflow-y: auto;
            padding: 4px;
        }

        .block-picker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.1s;
        }
        .block-picker-item:hover { background: var(--bg-block-hover); }
        .block-picker-item.active {
            background: var(--accent);
            border-color: var(--accent-light);
        }

        .block-picker-item.active .block-picker-mode { color: #fff; }

            width: 14px; height: 14px;
            color: var(--text-secondary);
            flex-shrink: 0;
            stroke-width: 2.2;
        }
        .block-picker-label {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Courier New', Courier, monospace;

        .block-picker-mode {
            font-size: 0.62rem;

            letter-spacing: 0.5px;
        }

        .block-picker-footer {

            border-top: 1px solid var(--border);

            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;

        /* 首帧防闪烁：在 body 渲染前同步设置 data-theme */
        (function () {
            var THEME_KEY = 'app-theme-v1';
            var pref = 'dark';
            try {
                pref = localStorage.getItem(THEME_KEY) || 'dark';
            } catch (e) { }
            if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'dark';
            var actual = pref;
            if (pref === 'system') {
                actual = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', actual);
        })();

        let currentLang = 'zh';

        function getLangPref() {
            try {
                const v = localStorage.getItem(LANG_KEY);
                if (v === 'zh' || v === 'en') return v;
            } catch (e) { }
            return 'zh';
        }

        // 取翻译：当前语言 → 中文 → key 本身；支持 {name} 占位
        function t(key, params) {
            const dict = I18N[currentLang] || I18N.zh;
            let s = dict[key];
            if (s === undefined) s = I18N.zh[key];
            if (s === undefined) s = key;
            if (params) {
                s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? String(params[k]) : m));
            }
            return s;
        }

        // 写入文本：元素内若已有 SVG 图标等子元素，只改最后一个文本节点，避免把图标冲掉
        function setI18nText(el, val) {
            if (el.children.length > 0) {
                const texts = Array.prototype.filter.call(el.childNodes, n => n.nodeType === 3 && n.nodeValue.trim());
                if (texts.length) {
                    texts[texts.length - 1].nodeValue = ' ' + val;
                    for (let i = 0; i < texts.length - 1; i++) texts[i].nodeValue = '';
                    return;
                }
            }
            el.textContent = val;
        }

        function applyI18n(root) {
            const scope = root || document;
            scope.querySelectorAll('[data-i18n]').forEach(el => {
                setI18nText(el, t(el.dataset.i18n));
            });
            scope.querySelectorAll('[data-i18n-html]').forEach(el => {
                el.innerHTML = t(el.dataset.i18nHtml);
            });
            scope.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.title = t(el.dataset.i18nTitle);
            });
            scope.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }

        function updateLangButton() {
            const btn = document.getElementById('langToggleBtn');
            const label = document.getElementById('langToggleText');
            if (btn) btn.title = t('langToggleTitle');
            if (label) label.textContent = currentLang === 'zh' ? '中' : 'EN';
        }

        function refreshUiText() {
            updateLangButton();
            updateThemeButton(getThemePref());

            if (Array.isArray(BLOCKS) && BLOCKS.length) renderBlocksPanel();
            if (blockPickerState.visible) renderBlockPickerList();

        function setLang(lang, opts) {
            currentLang = (lang === 'en') ? 'en' : 'zh';
            document.documentElement.setAttribute('lang', currentLang === 'zh' ? 'zh-CN' : 'en');
            document.documentElement.setAttribute('data-lang', currentLang);
            if (!opts || opts.persist !== false) {
                try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) { }
            }
            document.title = t('appTitle');
            applyI18n();
            updateLangButton();
            refreshUiText();
        }

        // ==================== 插入模式（Line / Exp）====================
        /**
         * 积木插入模式归一化。
         * 规范值：'line' | 'exp'
         * 历史值：'lc'（旧版 Exp 写法），读入时视同 'exp'。
         * 写入一律用规范值，旧 JSON 导入后自动升级。
         */
        const MODE_LINE = 'line';
        const MODE_EXP = 'exp';

        function normalizeMode(m) {
            return (m === 'exp' || m === 'lc') ? MODE_EXP : MODE_LINE;
        }

        function normalizeBlocksModes(blocks) {
            if (!Array.isArray(blocks)) return blocks;
            blocks.forEach(cat => {
                Object.keys((cat && cat.subgroups) || {}).forEach(sub => {
                    (cat.subgroups[sub] || []).forEach(item => {
                        if (item) item.mode = normalizeMode(item.mode);
                    });
                });
            });
            return blocks;
        }

        // ==================== 高亮与滚动同步 ====================
        let lastHighlightedText = null;

        function syncScrollbarWidth() {
            const scrollbarWidth = codeInput.offsetWidth - codeInput.clientWidth;
            highlightPre.style.paddingRight = (16 + scrollbarWidth) + 'px';
            searchPre.style.paddingRight = (16 + scrollbarWidth) + 'px';
            // 行号列高度对齐 textarea 内容区（不含水平滚动条），避免遮挡滚动条
            if (lnVisible) lineNumbers.style.height = codeInput.clientHeight + 'px';
        }

        function updateHighlight() {
            const text = codeInput.value;
            renderLineNumbers(text);
            if (text === lastHighlightedText) return;

            if (typeof Prism !== 'undefined' && Prism.languages && Prism.languages.cpp) {
                const highlighted = Prism.highlight(text, Prism.languages.cpp, 'cpp');
                highlightCode.innerHTML = highlighted;
            } else {
                highlightCode.textContent = text;
            }

            lastHighlightedText = text;
            syncScrollbarWidth();
            syncScroll();
        }

        let scrollRaf = null;
        function syncScroll() {
            if (scrollRaf) return;
            scrollRaf = requestAnimationFrame(() => {
                const scrollTop = codeInput.scrollTop;
                const scrollLeft = codeInput.scrollLeft;
                const tf = `translate(${-scrollLeft}px, ${-scrollTop}px)`;
                highlightPre.style.transform = tf;
                searchPre.style.transform = tf;
                if (lnVisible) {
                    // 行号只做纵向偏移，横向不跟随
                    lineNumbersInner.style.transform = `translateY(${-scrollTop}px)`;
                }
                scrollRaf = null;
            });
        }

        // ==================== 行号 ====================
        const LN_STORAGE_KEY = 'line-numbers-visible';
        let lnVisible = localStorage.getItem(LN_STORAGE_KEY) !== '0';
        let lnLastCount = -1;
        let lnLastActive = -1;
        let lnGutterWidth = 40;

        /** 计算光标所在行（1 起） */
        function getCaretLine() {
            const pos = codeInput.selectionStart;
            const text = codeInput.value;
            let line = 1;
            for (let i = 0; i < pos; i++) {
                if (text.charCodeAt(i) === 10) line++;
            }
            return line;
        }

        /** 只刷新当前行高亮 */
        function updateActiveLineNumber() {
            if (!lnVisible) return;
            const line = getCaretLine();
            if (line === lnLastActive) return;
            const prev = lineNumbersInner.querySelector('.ln-row.current');
            if (prev) prev.classList.remove('current');
            const cur = lineNumbersInner.children[line - 1];
            if (cur) cur.classList.add('current');
            lnLastActive = line;
        }

        /** 重建行号内容（行数变化时才重建） */
        function renderLineNumbers(text) {
            if (!lnVisible) return;
            const src = text === undefined ? codeInput.value : text;
            let count = 1;
            for (let i = 0; i < src.length; i++) {
                if (src.charCodeAt(i) === 10) count++;
            }

            if (count !== lnLastCount) {
                const frag = [];
                for (let i = 1; i <= count; i++) {
                    frag.push('<div class="ln-row">' + i + '</div>');
                }
                lineNumbersInner.innerHTML = frag.join('');
                lnLastCount = count;
                lnLastActive = -1;
                applyGutterWidth(count);
            }
            updateActiveLineNumber();
        }

        /** 按总行数位数计算行号列宽度：3 位 40px，4 位 48px ... */
        function applyGutterWidth(count) {
            const w = Math.max(40, String(count).length * 8 + 16);
            lnGutterWidth = w;
            codeEditorContainer.style.setProperty('--ln-width', w + 'px');
            lineNumbers.style.width = w + 'px';
        }

        /** 应用显示 / 隐藏状态 */
        function applyLineNumberVisibility(skipRender) {
            codeEditorContainer.classList.toggle('show-ln', lnVisible);
            lineNumBtn.classList.toggle('active', lnVisible);
            localStorage.setItem(LN_STORAGE_KEY, lnVisible ? '1' : '0');

            if (lnVisible) {
                if (!skipRender) renderLineNumbers(codeInput.value);
                lineNumbers.style.height = codeInput.clientHeight + 'px';
                lineNumbersInner.style.transform = `translateY(${-codeInput.scrollTop}px)`;
            }
            // 左侧 padding 改变，需重新补偿滚动条宽度并同步层位置
            syncScrollbarWidth();
            syncScroll();
        }

        lineNumBtn.addEventListener('click', () => {
            lnVisible = !lnVisible;
            if (lnVisible) lnLastCount = -1;
            applyLineNumberVisibility();
            codeInput.focus();
        });

        function updateCursorPosition() {
            const start = codeInput.selectionStart;
            const textBefore = codeInput.value.substring(0, start);
            const lines = textBefore.split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            cursorPos.textContent = t('cursorPos', { line: line, col: col });
            updateActiveLineNumber();
        }

        // ==================== 历史栈 ====================
        const history = {
            stack: [], index: -1, maxSize: 200, lastText: null, debounceTimer: null,
        };

        function pushHistory() {
            const text = codeInput.value;
            const caret = codeInput.selectionStart;
            if (history.lastText === text) return;
            if (history.index < history.stack.length - 1) {
                history.stack = history.stack.slice(0, history.index + 1);
            }
            history.stack.push({ text, caret });
            if (history.stack.length > history.maxSize) {
                history.stack.shift();
            } else {
                history.index++;
            }
            history.lastText = text;
            updateUndoRedoButtons();
        }

        function schedulePushHistory() {
            if (history.debounceTimer) clearTimeout(history.debounceTimer);
            history.debounceTimer = setTimeout(() => {
                pushHistory();
                history.debounceTimer = null;
            }, 400);
        }

        function pushHistoryImmediate() {
            if (history.debounceTimer) {
                clearTimeout(history.debounceTimer);
                history.debounceTimer = null;
            }
            pushHistory();
        }

        function updateUndoRedoButtons() {
            undoBtn.disabled = history.index <= 0;
            redoBtn.disabled = history.index >= history.stack.length - 1;
        }

        function applyHistoryState(state) {
            codeInput.value = state.text;
            updateHighlight();
            codeInput.setSelectionRange(state.caret, state.caret);
            codeInput.focus();
            updateCursorPosition();
            history.lastText = state.text;
            updateUndoRedoButtons();
        }

        function undo() {
            if (history.index <= 0) return;
            const currentText = codeInput.value;
            if (history.lastText !== currentText) pushHistoryImmediate();
            if (history.index <= 0) return;
            history.index--;
            applyHistoryState(history.stack[history.index]);
        }

        function redo() {
            if (history.index >= history.stack.length - 1) return;
            history.index++;
            applyHistoryState(history.stack[history.index]);
        }

        // ==================== 缩进工具 ====================
        function getLineStart(text, pos) {
            return text.lastIndexOf('\n', pos - 1) + 1;
        }
        function getLineEnd(text, pos) {
            const idx = text.indexOf('\n', pos);
            return idx === -1 ? text.length : idx;
        }

        function getPrevNonEmptyIndent(text, lineStart) {
            let pos = lineStart - 1;
            while (pos >= 0) {
                const prevLineEnd = pos;
                const prevLineStart = getLineStart(text, pos);
                const prevLineContent = text.substring(prevLineStart, prevLineEnd);
                if (prevLineContent.trim().length > 0) {
                    const match = prevLineContent.match(/^[ \t]*/);
                    return match ? match[0] : '';
                }
                pos = prevLineStart - 1;
            }
            return '';
        }

        function handleEmptyLineTab(direction) {
            const text = codeInput.value;
            const selStart = codeInput.selectionStart;
            const lineStart = getLineStart(text, selStart);
            const lineEnd = getLineEnd(text, selStart);
            const lineContent = text.substring(lineStart, lineEnd);

            if (lineContent.trim().length !== 0) return false;

            const prevIndent = lineStart > 0 ? getPrevNonEmptyIndent(text, lineStart) : '';
            let targetIndent;

            if (direction > 0) {
                targetIndent = prevIndent + INDENT;
            } else {
                if (lineContent.length > prevIndent.length) {
                    targetIndent = prevIndent;
                } else if (prevIndent.length >= INDENT.length) {
                    targetIndent = prevIndent.substring(0, prevIndent.length - INDENT.length);
                } else {
                    targetIndent = '';
                }
            }

            if (targetIndent === lineContent) return true;

            const newText = text.substring(0, lineStart) + targetIndent + text.substring(lineEnd);
            codeInput.value = newText;
            const newCaret = lineStart + targetIndent.length;
            codeInput.setSelectionRange(newCaret, newCaret);

            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
            return true;
        }

        function indentSelection(direction) {
            const text = codeInput.value;
            let selStart = codeInput.selectionStart;
            let selEnd = codeInput.selectionEnd;
            const hasSelection = selStart !== selEnd;

            if (!hasSelection) {
                const handled = handleEmptyLineTab(direction);
                if (handled) return;
            }

            let effectiveEnd = selEnd;
            if (hasSelection && effectiveEnd > 0 && text[effectiveEnd - 1] === '\n') {
                effectiveEnd -= 1;
            }

            const startLineStart = getLineStart(text, selStart);
            const endLineStart = getLineStart(text, effectiveEnd);
            const endLineEnd = getLineEnd(text, effectiveEnd);

            const startCol = selStart - startLineStart;
            const endCol = effectiveEnd - endLineStart;

            const linesBlock = text.substring(startLineStart, endLineEnd);
            const lines = linesBlock.split('\n');

            let prevIndent = '';
            if (startLineStart > 0) {
                prevIndent = getPrevNonEmptyIndent(text, startLineStart);
            }

            const newLines = lines.map((line) => {
                const trimmed = line.trim();
                let newIndent;

                if (trimmed.length === 0) {
                    if (direction > 0) {
                        newIndent = prevIndent + INDENT;
                    } else {
                        if (line.length > prevIndent.length) {
                            newIndent = prevIndent;
                        } else if (prevIndent.length >= INDENT.length) {
                            newIndent = prevIndent.substring(0, prevIndent.length - INDENT.length);
                        } else {
                            newIndent = '';
                        }
                    }
                } else {
                    let processed;
                    if (direction > 0) {
                        processed = INDENT + line;
                    } else {
                        const match = line.match(/^(\t| {1,4})/);
                        processed = match ? line.substring(match[0].length) : line;
                    }
                    const m = processed.match(/^[ \t]*/);
                    newIndent = m ? m[0] : '';

                    if (trimmed.endsWith('{')) {
                        prevIndent = newIndent + INDENT;
                    } else if (trimmed.startsWith('}')) {
                        prevIndent = newIndent.length >= INDENT.length
                            ? newIndent.substring(0, newIndent.length - INDENT.length)
                            : '';
                    } else {
                        prevIndent = newIndent;
                    }
                }

                return newIndent + (trimmed.length === 0 ? '' : trimmed);
            });

            const newBlock = newLines.join('\n');
            if (newBlock === linesBlock) return;

            const newText = text.substring(0, startLineStart) + newBlock + text.substring(endLineEnd);
            codeInput.value = newText;

            const firstLineDelta = newLines[0].length - lines[0].length;
            const lastLineDelta = newLines[lines.length - 1].length - lines[lines.length - 1].length;

            let newSelStart;
            if (startCol === 0) {
                newSelStart = startLineStart;
            } else {
                newSelStart = startLineStart + startCol + firstLineDelta;
                newSelStart = Math.max(startLineStart, newSelStart);
            }

            let newSelEnd;
            if (hasSelection) {
                let newLastLineStart = startLineStart;
                for (let i = 0; i < lines.length - 1; i++) {
                    newLastLineStart += newLines[i].length + 1;
                }
                let newEndCol;
                if (endCol === 0 && effectiveEnd === endLineStart) {
                    newEndCol = 0;
                } else {
                    newEndCol = Math.max(0, endCol + lastLineDelta);
                }
                newSelEnd = newLastLineStart + newEndCol;
                newSelEnd = Math.max(newSelStart, Math.min(newSelEnd, newText.length));
            } else {
                newSelEnd = newSelStart;
            }

            codeInput.setSelectionRange(newSelStart, newSelEnd);

            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
        }

        function autoIndentSelection() {
            const text = codeInput.value;
            const selStart = codeInput.selectionStart;
            const selEnd = codeInput.selectionEnd;
            const hasSelection = selStart !== selEnd;

            let effectiveEnd = selEnd;
            if (hasSelection && effectiveEnd > 0 && text[effectiveEnd - 1] === '\n') {
                effectiveEnd -= 1;
            }

            const startLineStart = getLineStart(text, selStart);
            const endLineEnd = getLineEnd(text, effectiveEnd);

            const linesBlock = text.substring(startLineStart, endLineEnd);
            const lines = linesBlock.split('\n');

            let prevIndent = '';
            if (startLineStart > 0) {
                prevIndent = getPrevNonEmptyIndent(text, startLineStart);
            }

            const newLines = lines.map((line) => {
                const trimmed = line.trim();

                if (trimmed.length === 0) {
                    return prevIndent;
                }

                let targetIndent = prevIndent;
                let nextIndent = prevIndent;

                if (trimmed.startsWith('}')) {
                    targetIndent = targetIndent.length >= INDENT.length
                        ? targetIndent.substring(0, targetIndent.length - INDENT.length)
                        : '';
                    if (trimmed.endsWith('{')) {
                        nextIndent = targetIndent + INDENT;
                    } else {
                        nextIndent = targetIndent;
                    }
                } else if (trimmed.endsWith('{')) {
                    nextIndent = targetIndent + INDENT;
                } else {
                    nextIndent = targetIndent;
                }

                const newLine = targetIndent + trimmed;
                prevIndent = nextIndent;
                return newLine;
            });

            const newBlock = newLines.join('\n');

            if (newBlock === linesBlock) {
                if (!hasSelection && lines[0].trim().length === 0) {
                    const lineEndPos = startLineStart + newLines[0].length;
                    codeInput.setSelectionRange(lineEndPos, lineEndPos);
                    codeInput.focus();
                    updateCursorPosition();
                }
                return;
            }

            const newText = text.substring(0, startLineStart) + newBlock + text.substring(endLineEnd);
            codeInput.value = newText;

            const startCol = selStart - startLineStart;
            const firstLineDelta = newLines[0].length - lines[0].length;

            let newSelStart;
            let newSelEnd;

            if (!hasSelection) {
                const originalLine = lines[0] || '';
                if (originalLine.trim().length === 0) {
                    newSelStart = newSelEnd = startLineStart + newLines[0].length;
                } else {
                    if (startCol === 0) {
                        newSelStart = startLineStart;
                    } else {
                        newSelStart = startLineStart + Math.max(0, startCol + firstLineDelta);
                        newSelStart = Math.max(startLineStart, Math.min(newSelStart, newText.length));
                    }
                    newSelEnd = newSelStart;
                }
            } else {
                if (startCol === 0) {
                    newSelStart = startLineStart;
                } else {
                    newSelStart = startLineStart + Math.max(0, startCol + firstLineDelta);
                    newSelStart = Math.max(startLineStart, Math.min(newSelStart, newText.length));
                }
                let totalDelta = 0;
                for (let i = 0; i < lines.length; i++) {
                    totalDelta += newLines[i].length - lines[i].length;
                }
                newSelEnd = Math.min(endLineEnd + totalDelta, newText.length);
                newSelEnd = Math.max(newSelStart, newSelEnd);
            }

            codeInput.setSelectionRange(newSelStart, newSelEnd);

            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
        }

        function handleEnter() {
            const text = codeInput.value;
            const selStart = codeInput.selectionStart;
            const selEnd = codeInput.selectionEnd;

            const before = text.substring(0, selStart);
            const after = text.substring(selEnd);

            const lineStart = getLineStart(text, selStart);
            const lineEnd = getLineEnd(text, selStart);
            const lineContent = text.substring(lineStart, lineEnd);
            const currentIndent = (lineContent.match(/^[ \t]*/) || [''])[0];
            const colInLine = selStart - lineStart;
            const beforeCursorInLine = lineContent.substring(0, colInLine);
            const afterCursorInLine = lineContent.substring(colInLine);

            const trimmedBefore = beforeCursorInLine.replace(/\s+$/, '');
            const lastChar = trimmedBefore.length > 0 ? trimmedBefore[trimmedBefore.length - 1] : '';

            let nextIndent = currentIndent;
            const afterCursorTrimmed = afterCursorInLine.trim();
            const afterStartsWithBrace = afterCursorTrimmed.startsWith('}');

            if (lastChar === '{' && !afterStartsWithBrace) {
                nextIndent = currentIndent + INDENT;
            }

            const insertion = '\n' + nextIndent;
            const newText = before + insertion + after;
            codeInput.value = newText;
            const newCaret = selStart + insertion.length;
            codeInput.setSelectionRange(newCaret, newCaret);
            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
        }

        function handleCloseBrace() {
            const text = codeInput.value;
            const selStart = codeInput.selectionStart;
            const selEnd = codeInput.selectionEnd;

            if (selStart !== selEnd) {
                insertTextAtCursor('}');
                return;
            }

            const lineStart = getLineStart(text, selStart);
            const lineContentBefore = text.substring(lineStart, selStart);
            const onlyWhitespaceBefore = /^[ \t]*$/.test(lineContentBefore);

            if (onlyWhitespaceBefore && lineContentBefore.length > 0) {
                const currentIndent = lineContentBefore;
                const indentMatch = currentIndent.match(/(\t| {1,4})$/);
                const newIndent = indentMatch
                    ? currentIndent.substring(0, currentIndent.length - indentMatch[0].length)
                    : currentIndent;

                const lineEnd = getLineEnd(text, selStart);
                const afterCursorInLine = text.substring(selStart, lineEnd);
                const beforeLine = text.substring(0, lineStart);
                const afterLine = text.substring(lineEnd);

                const newLine = newIndent + '}' + afterCursorInLine;
                const newText = beforeLine + newLine + afterLine;
                codeInput.value = newText;
                const newCaret = lineStart + newIndent.length + 1;
                codeInput.setSelectionRange(newCaret, newCaret);
                updateHighlight();
                updateCursorPosition();
                schedulePushHistory();
            } else {
                insertTextAtCursor('}');
            }
        }

        function insertTextAtCursor(str) {
            const text = codeInput.value;
            const start = codeInput.selectionStart;
            const end = codeInput.selectionEnd;
            const newText = text.substring(0, start) + str + text.substring(end);
            codeInput.value = newText;
            const newCaret = start + str.length;
            codeInput.setSelectionRange(newCaret, newCaret);
            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
        }

        // ==================== 积木插入 ====================
        function renderCode(template) {
            const useStd = !omitStdCheckbox.checked;
            return template.replace(/\{\{STD\}\}/g, useStd ? 'std::' : '');
        }

        function insertCode(template, mode, targetOffset) {
            mode = normalizeMode(mode);   // 兜底：'lc' 等历史值统一为 'exp'
            let snippet = renderCode(template);
            const text = codeInput.value;
            const caretOffset = targetOffset !== undefined ? targetOffset : (codeInput.selectionStart || 0);

            if (mode === MODE_EXP) {
                const lines = snippet.split('\n');
                if (lines.length === 1) {
                    if (expStripSemicolonCheckbox.checked) {
                        const trimmed = snippet.trimEnd();
                        if (trimmed.endsWith(';')) {
                            snippet = trimmed.slice(0, -1);
                        }
                    }
                } else {
                    const lineStart = getLineStart(text, caretOffset);
                    const lineEnd = getLineEnd(text, caretOffset);
                    const lineContent = text.substring(lineStart, lineEnd);
                    const indent = (lineContent.match(/^[ \t]*/) || [''])[0];
                    snippet = lines.map((line, i) => {
                        if (i === 0) return line;
                        if (line.length === 0) return line;
                        return indent + line;
                    }).join('\n');
                }

                const newText = text.substring(0, caretOffset) + snippet + text.substring(caretOffset);
                codeInput.value = newText;
                const newCaret = caretOffset + snippet.length;
                codeInput.setSelectionRange(newCaret, newCaret);
                updateHighlight();
                updateCursorPosition();
                codeInput.focus();
                setTimeout(pushHistoryImmediate, 0);
                return;
            }

            const textBefore = text.substring(0, caretOffset);
            const lastNewline = textBefore.lastIndexOf('\n');
            const lineStart = lastNewline + 1;
            const lineEnd = text.indexOf('\n', lineStart) === -1 ? text.length : text.indexOf('\n', lineStart);
            const lineContent = text.substring(lineStart, lineEnd);
            const indentMatch = lineContent.match(/^[ \t]*/);
            const indent = indentMatch ? indentMatch[0] : '';
            const contentAfterIndent = lineContent.substring(indent.length);
            const isLineEmpty = contentAfterIndent.trim().length === 0;

            const snippetLines = snippet.split('\n');
            const indentedLines = snippetLines.map(line => {
                if (line.length === 0) return line;
                return indent + line;
            });
            let finalSnippet = indentedLines.join('\n') + '\n' + indent;

            let insertPos, replaceEnd;
            if (isLineEmpty) {
                insertPos = lineStart;
                replaceEnd = lineEnd;
            } else {
                insertPos = lineStart;
                replaceEnd = lineStart + indent.length;
            }

            const newText = text.substring(0, insertPos) + finalSnippet + text.substring(replaceEnd);
            codeInput.value = newText;
            const newCaret = insertPos + finalSnippet.length;
            codeInput.setSelectionRange(newCaret, newCaret);
            updateHighlight();
            updateCursorPosition();
            codeInput.focus();
            setTimeout(pushHistoryImmediate, 0);
        }

        function getOffsetFromPoint(clientX, clientY) {
            const rect = codeInput.getBoundingClientRect();
            const paddingTop = 16;
            // 行号可见时左侧留白 = 16 + 行号列宽 + 8（与 CSS padding-left 保持一致）
            const paddingLeft = lnVisible ? (24 + lnGutterWidth) : 16;
            const lineHeight = 24;
            const charWidth = 9;

            const relY = clientY - rect.top + codeInput.scrollTop - paddingTop;
            const relX = clientX - rect.left + codeInput.scrollLeft - paddingLeft;

            let lineIndex = Math.floor(relY / lineHeight);
            if (lineIndex < 0) lineIndex = 0;

            const lines = codeInput.value.split('\n');
            if (lineIndex >= lines.length) lineIndex = lines.length - 1;

            let offset = 0;
            for (let i = 0; i < lineIndex; i++) {
                offset += lines[i].length + 1;
            }

            const lineText = lines[lineIndex] || '';
            let col = Math.round(relX / charWidth);
            if (col < 0) col = 0;
            if (col > lineText.length) col = lineText.length;

            return offset + col;
        }

        // ==================== 查找替换 ====================
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function buildSearchRegex() {
            const kw = searchInput.value;
            if (!kw) return null;
            let pattern = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (wordBtn.classList.contains('active')) {
                pattern = '\\b' + pattern + '\\b';
            }
            const flags = 'g' + (caseBtn.classList.contains('active') ? '' : 'i');
            return new RegExp(pattern, flags);
        }

        function renderSearchLayer() {
            if (!searchState.visible || searchState.matches.length === 0) {
                searchCode.innerHTML = '';
                return;
            }
            const text = codeInput.value;
            const matches = searchState.matches;
            let html = '';
            let last = 0;
            matches.forEach((m, i) => {
                html += escapeHtml(text.substring(last, m.start));
                const cls = i === searchState.currentIndex ? 'search-match current' : 'search-match';
                html += `<span class="${cls}">${escapeHtml(text.substring(m.start, m.end))}</span>`;
                last = m.end;
            });
            html += escapeHtml(text.substring(last));
            searchCode.innerHTML = html;
            syncScrollbarWidth();
            syncScroll();
        }

        function performSearch() {
            const regex = buildSearchRegex();
            const text = codeInput.value;
            searchState.matches = [];
            if (regex && text) {
                let m;
                while ((m = regex.exec(text)) !== null) {
                    searchState.matches.push({ start: m.index, end: m.index + m[0].length });
                    if (m.index === regex.lastIndex) regex.lastIndex++;
                }
            }
            if (searchState.matches.length === 0) {
                searchState.currentIndex = -1;
            } else {
                if (searchState.currentIndex < 0 || searchState.currentIndex >= searchState.matches.length) {
                    searchState.currentIndex = 0;
                }
            }
            renderSearchLayer();
            updateSearchUI();
            scrollToMatch();
        }

        function scrollToMatch() {
            const m = searchState.matches[searchState.currentIndex];
            if (!m) return;
            codeInput.focus();
            codeInput.setSelectionRange(m.start, m.end);
            updateCursorPosition();
            searchInput.focus();
        }

        function updateSearchUI() {
            const total = searchState.matches.length;
            if (total === 0) {
                searchCount.textContent = searchInput.value ? t('searchNoResults') : '0 / 0';
            } else {
                searchCount.textContent = `${searchState.currentIndex + 1} / ${total}`;
            }
        }

        function nextMatch() {
            if (searchState.matches.length === 0) return;
            searchState.currentIndex = (searchState.currentIndex + 1) % searchState.matches.length;
            renderSearchLayer();
            updateSearchUI();
            scrollToMatch();
        }

        function prevMatch() {
            if (searchState.matches.length === 0) return;
            searchState.currentIndex = (searchState.currentIndex - 1 + searchState.matches.length) % searchState.matches.length;
            renderSearchLayer();
            updateSearchUI();
            scrollToMatch();
        }

        function replaceCurrent() {
            const m = searchState.matches[searchState.currentIndex];
            if (!m) return;
            const text = codeInput.value;
            const newText = text.substring(0, m.start) + replaceInput.value + text.substring(m.end);
            codeInput.value = newText;
            updateHighlight();
            schedulePushHistory();
            performSearch();
        }

        function replaceAll() {
            const regex = buildSearchRegex();
            if (!regex) return;
            const text = codeInput.value;
            const newText = text.replace(regex, replaceInput.value);
            if (newText === text) return;
            codeInput.value = newText;
            updateHighlight();
            schedulePushHistory();
            performSearch();
        }

        function openSearch(showReplace) {
            if (blockPickerState.visible) hideBlockPicker(false);
            searchState.visible = true;
            searchState.showReplace = showReplace;
            searchBar.classList.add('show');
            if (showReplace) {
                searchBar.classList.add('show-replace');
            } else {
                searchBar.classList.remove('show-replace');
            }
            searchInput.focus();
            searchInput.select();
            if (searchInput.value) performSearch();
        }

        function closeSearch() {
            searchState.visible = false;
            searchBar.classList.remove('show');
            searchState.matches = [];
            searchState.currentIndex = -1;
            searchCode.innerHTML = '';
            codeInput.focus();
        }

        searchInput.addEventListener('input', () => performSearch());
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.shiftKey) prevMatch(); else nextMatch();
            } else if (e.key === 'Escape') {
                closeSearch();
            }
        });
        caseBtn.addEventListener('click', () => { caseBtn.classList.toggle('active'); performSearch(); });
        wordBtn.addEventListener('click', () => { wordBtn.classList.toggle('active'); performSearch(); });
        prevBtn.addEventListener('click', prevMatch);
        nextBtn.addEventListener('click', nextMatch);
        replaceOneBtn.addEventListener('click', replaceCurrent);
        replaceAllBtn.addEventListener('click', replaceAll);
        closeSearchBtn.addEventListener('click', closeSearch);
        document.getElementById('findBtn').addEventListener('click', () => openSearch(false));
        document.getElementById('replaceBtn').addEventListener('click', () => openSearch(true));

        // ==================== 文件操作 ====================
        document.getElementById('openBtn').addEventListener('click', () => openFileInput.click());
        openFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const content = ev.target.result;
                codeInput.value = content;
                titleInput.value = file.name;
                updateHighlight();
                history.stack = [{ text: content, caret: 0 }];
                history.index = 0;
                history.lastText = content;
                updateUndoRedoButtons();
                updateCursorPosition();
                codeInput.focus();
                codeInput.setSelectionRange(content.length, content.length);
            };
            reader.readAsText(file);
            openFileInput.value = '';

        function applyImportedText(text) {
            if (text === undefined || text === null) {
                alert(t('alertNoImportText'));
                return;
            }
            codeInput.value = text;
            updateHighlight();
            history.stack = [{ text, caret: 0 }];
            history.index = 0;
            history.lastText = text;
            updateUndoRedoButtons();
            updateCursorPosition();
            codeInput.focus();
            codeInput.setSelectionRange(text.length, text.length);
        }

        async function clipboardImport() {
            if (navigator.clipboard && navigator.clipboard.readText) {
                try {
                    const text = await navigator.clipboard.readText();
                    applyImportedText(text);
                    return;
                } catch (e) {
                    console.warn('clipboard.readText 失败，降级为手动粘贴', e);
                }
            }
            openPasteDialog();
        }

        async function clipboardExport() {
            const text = codeInput.value;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    showCopiedFeedback();
                    return;
                } catch (e) {
                    console.warn('clipboard.writeText 失败，降级为 execCommand', e);
                }
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            ta.style.top = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            let ok = false;
            try {
                ok = document.execCommand('copy');
            } catch (e) {
                ok = false;
            }
            document.body.removeChild(ta);
            if (ok) {
                showCopiedFeedback();
            } else {
                alert(t('alertCopyFail'));
            }
        }

            const btn = document.getElementById('clipboardExportBtn');
