        // ==================== 数据保存/加载 ====================
        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(BLOCKS));
            } catch (e) {
                console.warn('保存失败', e);
            }
        }

        function isValidBlockData(data) {
            if (!Array.isArray(data) || data.length === 0) return false;
            return data.every(c => 
                c && c.category && c.subgroups &&
                typeof c.subgroups === 'object' &&
                Array.isArray(c.subgroups.none) &&
                Array.isArray(c.subgroups.c) &&
                Array.isArray(c.subgroups.cpp)
            );
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (isValidBlockData(data)) return data;
                }
            } catch (e) {
                console.warn('加载失败', e);
            }
            return null;
        }

        // ==================== 工具 ====================
        function genId(prefix = 'id') {
            return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
        }

        function findCategory(catId) {
            return BLOCKS.find(c => c.id === catId);
        }

        function findBlock(catId, sub, blockId) {
            const cat = findCategory(catId);
            if (!cat) return null;
            return (cat.subgroups[sub] || []).find(b => b.id === blockId) || null;
        }

        function iconSvg(name, extraCls = '') {
            const cls = extraCls ? `icon ${extraCls}` : 'icon';
            return `<svg class="${cls}"><use href="#icon-${name || 'cube'}"/></svg>`;
        }

        function collectAllIds() {
            const ids = new Set();
            BLOCKS.forEach(cat => {
                if (cat.id) ids.add(cat.id);
                Object.keys(cat.subgroups || {}).forEach(sub => {
                    (cat.subgroups[sub] || []).forEach(b => {
                        if (b.id) ids.add(b.id);
                    });
                });
            });
            return ids;
        }

        function ensureUniqueId(preferredId, usedIds, prefix) {
            if (preferredId && !usedIds.has(preferredId)) {
                usedIds.add(preferredId);
                return preferredId;
            }
            let newId = genId(prefix);
            while (usedIds.has(newId)) {
                newId = genId(prefix);
            }
            usedIds.add(newId);
            return newId;
        }

        function mergeBlocks(incoming) {
            const usedIds = collectAllIds();

            incoming.forEach(inCat => {
                let targetCat = BLOCKS.find(c => c.category === inCat.category);

                if (!targetCat) {
                    targetCat = {
                        id: ensureUniqueId(inCat.id, usedIds, 'cat'),
                        category: inCat.category,
                        icon: inCat.icon || 'cube',
                        collapsed: !!inCat.collapsed,
                        subgroups: { none: [], c: [], cpp: [] }
                    };
                    BLOCKS.push(targetCat);
                }

                Object.keys(inCat.subgroups || {}).forEach(sub => {
                    if (!targetCat.subgroups[sub]) {
                        targetCat.subgroups[sub] = [];
                    }
                    const inItems = inCat.subgroups[sub] || [];
                    const existingArr = targetCat.subgroups[sub];

                    inItems.forEach(inItem => {
                        if (!inItem || !inItem.code) return;

                        const inLabel = (inItem.label || '').trim();

                        if (!inLabel) {
                            const newItem = { ...inItem };
                            newItem.id = ensureUniqueId(inItem.id, usedIds, 'custom');
                            existingArr.push(newItem);
                            return;
                        }

                        const existingIdx = existingArr.findIndex(b => {
                            const bLabel = (b.label || '').trim();
                            return bLabel === inLabel;
                        });

                        if (existingIdx >= 0) {
                            const existingItem = existingArr[existingIdx];
                            const newItem = { ...inItem };
                            newItem.id = existingItem.id;
                            existingArr[existingIdx] = newItem;
                        } else {
                            const newItem = { ...inItem };
                            newItem.id = ensureUniqueId(inItem.id, usedIds, 'custom');
                            existingArr.push(newItem);
                        }
                    });
                });
            });
        }

        // ==================== 渲染 ====================
        function buildBlockElement(cat, sub, item) {
            const div = document.createElement('div');
            div.className = 'block';
            div.draggable = !isReorderMode;
            div.dataset.code = item.code;
            div.dataset.mode = item.mode;
            div.dataset.id = item.id;
            div.dataset.catId = cat.id;
            div.dataset.sub = sub;

            const iconWrap = document.createElement('span');
            iconWrap.innerHTML = iconSvg(item.icon, 'block-icon');
            div.appendChild(iconWrap.firstChild);

            const label = document.createElement('span');
            label.className = 'block-label';
            label.textContent = renderCode(item.label || item.code.split('\n')[0]);
            div.appendChild(label);

            if (isReorderMode) {
                const reorderWrap = document.createElement('span');
                reorderWrap.className = 'block-reorder-btns';

                const upBtn = document.createElement('button');
                upBtn.innerHTML = iconSvg('arrow-up');
                upBtn.title = t('rowMoveUpTitle');
                upBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    moveBlock(cat, sub, item, -1);
                });
                reorderWrap.appendChild(upBtn);

                const downBtn = document.createElement('button');
                downBtn.innerHTML = iconSvg('arrow-down');
                downBtn.title = t('rowMoveDownTitle');
                downBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    moveBlock(cat, sub, item, 1);
                });
                reorderWrap.appendChild(downBtn);

                div.appendChild(reorderWrap);
            } else {
                const modeWrap = document.createElement('span');
                modeWrap.className = 'block-mode';
                modeWrap.title = t('rowModeTitle');

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = normalizeMode(item.mode) === MODE_EXP;
                cb.addEventListener('click', (e) => e.stopPropagation());
                cb.addEventListener('change', (e) => {
                    item.mode = cb.checked ? MODE_EXP : MODE_LINE;
                    div.dataset.mode = item.mode;
                    saveToStorage();
                    e.stopPropagation();
                });
                modeWrap.appendChild(cb);

                const modeText = document.createElement('span');
                modeText.textContent = t('modeExp');   // 中文「公式」/ 英文 Exp
                modeWrap.appendChild(modeText);

                div.appendChild(modeWrap);

                div.addEventListener('click', () => {
                    insertCode(item.code, item.mode);
                });

                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', JSON.stringify({
                        code: item.code,
                        mode: item.mode
                    }));
                    e.dataTransfer.effectAllowed = 'copy';
                    div.style.opacity = '0.6';
                });
                div.addEventListener('dragend', () => {
                    div.style.opacity = '1';
                });

                div.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    openBlockEditor(cat, sub, item);
                });
            }

            return div;
        }

                    (cat.subgroups.none || []).forEach(item => body.appendChild(buildBlockElement(cat, 'none', item)));
                }

                    const items = cat.subgroups[subKey] || [];

                    body.appendChild(label);

                });

                catEl.appendChild(body);

            buildCompletionIndex();

        function moveCategory(cat, dir) {
            const idx = BLOCKS.indexOf(cat);
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= BLOCKS.length) return;
            BLOCKS.splice(idx, 1);
            BLOCKS.splice(newIdx, 0, cat);
            saveToStorage();
            renderBlocksPanel();
        }

        function moveBlock(cat, sub, block, dir) {
            const arr = cat.subgroups[sub];
            if (!arr) return;
            const idx = arr.indexOf(block);
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= arr.length) return;
            arr.splice(idx, 1);
            arr.splice(newIdx, 0, block);
            saveToStorage();
            renderBlocksPanel();
        }

        let completionIndex = [];

        function buildCompletionIndex() {
            completionIndex = [];
            BLOCKS.forEach(cat => {
                Object.keys(cat.subgroups || {}).forEach(sub => {
                    (cat.subgroups[sub] || []).forEach(item => {
                        if (!item || !item.code) return;
                        const label = renderCode(item.label || item.code.split('\n')[0]);
                        completionIndex.push({
                            catId: cat.id,
                            sub: sub,
                            blockId: item.id,
                            label: label,
                            code: item.code,          // 原始模板，含 {{STD}}
                            mode: normalizeMode(item.mode),
                            icon: item.icon || 'cube',
                            category: cat.category,
                            searchText: label.toLowerCase()
                        });
                    });
                });
            });
            // 浮层开着时同步刷新候选（配置变更/omitStd 切换）
            if (blockPickerState.visible) {
                blockPickerState.items = searchCompletions(blockPickerInput.value);
                blockPickerState.activeIndex = Math.min(
                    blockPickerState.activeIndex,
                    Math.max(0, blockPickerState.items.length - 1)
                );
                renderBlockPickerList();
            }
        }

        // ---- 模糊子序列匹配 ----
        function fuzzyScore(query, target) {
            let qi = 0, score = 0, lastMatch = -1;
            for (let ti = 0; ti < target.length && qi < query.length; ti++) {
                if (target[ti] === query[qi]) {
                    score += 1;
                    if (lastMatch === ti - 1) score += 2;   // 连续匹配
                    if (ti === 0) score += 3;               // 首字符匹配
                    lastMatch = ti;
                    qi++;
                }
            }
            if (qi < query.length) return null;             // 不匹配
            return score - target.length * 0.05;            // 短 label 略优先
        }

        function searchCompletions(query) {
            const q = (query || '').trim().toLowerCase();
            if (!q) return completionIndex.slice(0, MAX_PICKER_ITEMS);
            const scored = [];
            for (let i = 0; i < completionIndex.length; i++) {
                const s = fuzzyScore(q, completionIndex[i].searchText);
                if (s !== null) scored.push({ item: completionIndex[i], s: s });
            }
            scored.sort((a, b) => b.s - a.s);
            return scored.slice(0, MAX_PICKER_ITEMS).map(x => x.item);
        }

        // ---- 列表渲染 ----
        function renderBlockPickerList() {
            const items = blockPickerState.items;
            blockPickerList.innerHTML = '';

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'block-picker-empty';
                empty.textContent = blockPickerInput.value.trim()
                    ? t('pickerEmpty')
                    : t('pickerNoBlocks');
                blockPickerList.appendChild(empty);
                blockPickerCount.textContent = t('pickerCount', { n: 0 });
                return;
            }

            items.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'block-picker-item' + (idx === blockPickerState.activeIndex ? ' active' : '');
                row.dataset.index = String(idx);

                const iconWrap = document.createElement('span');
                iconWrap.innerHTML = iconSvg(item.icon);
                const iconEl = iconWrap.firstElementChild;
                if (iconEl) row.appendChild(iconEl);

                const labelEl = document.createElement('span');
                labelEl.className = 'block-picker-label';
                labelEl.textContent = item.label;
                row.appendChild(labelEl);

                const modeEl = document.createElement('span');
                modeEl.className = 'block-picker-mode';
                modeEl.textContent = item.mode === MODE_EXP ? t('modeExp') : t('modeLine');
                modeEl.title = item.mode === MODE_EXP ? t('modeExpTitle') : t('modeLineTitle');
                row.appendChild(modeEl);

                row.addEventListener('mouseenter', () => {
                    blockPickerState.activeIndex = idx;
                    updateBlockPickerActive();
                });
                row.addEventListener('mousedown', (e) => e.preventDefault());  // 防止筛选框失焦
                row.addEventListener('click', () => acceptBlockFromPicker(item));

                blockPickerList.appendChild(row);
            });

            blockPickerCount.textContent = t('pickerCount', { n: items.length });
            scrollPickerActiveIntoView();
        }

        function updateBlockPickerActive() {
            const rows = blockPickerList.querySelectorAll('.block-picker-item');
            rows.forEach((row, i) => row.classList.toggle('active', i === blockPickerState.activeIndex));
            scrollPickerActiveIntoView();
        }

        function scrollPickerActiveIntoView() {
            const active = blockPickerList.querySelector('.block-picker-item.active');
            if (!active) return;
            const listRect = blockPickerList.getBoundingClientRect();
            const itemRect = active.getBoundingClientRect();
            if (itemRect.top < listRect.top) {
                blockPickerList.scrollTop -= (listRect.top - itemRect.top);
            } else if (itemRect.bottom > listRect.bottom) {
                blockPickerList.scrollTop += (itemRect.bottom - listRect.bottom);
            }
        }

        // ---- 定位 ----
        function getCaretPixelPos() {
            const pos = codeInput.selectionStart || 0;
            const textBefore = codeInput.value.substring(0, pos);
            const lines = textBefore.split('\n');
            const lineIdx = lines.length - 1;
            const col = lines[lineIdx].length;
            const lineHeight = 24;
            const charWidth = 9;
            const padTop = 16;
            const padLeft = lnVisible ? (24 + lnGutterWidth) : 16;
            const rect = codeInput.getBoundingClientRect();
            return {
                left: rect.left + padLeft + col * charWidth - codeInput.scrollLeft,
                top: rect.top + padTop + (lineIdx + 1) * lineHeight - codeInput.scrollTop
            };
        }

        function positionBlockPicker(source, point) {
            const pw = blockPicker.offsetWidth || 460;
            const ph = blockPicker.offsetHeight || 300;
            const margin = 8;
            let left, top;

            if (source === 'toolbar') {
                left = (window.innerWidth - pw) / 2;
                top = (window.innerHeight - ph) / 2;
            } else {
                const pt = point || getCaretPixelPos();
                left = Math.max(margin, pt.left);
                top = pt.top;
                if (top + ph > window.innerHeight - margin) {
                    top = Math.max(margin, top - ph - 24);
                }
                if (left + pw > window.innerWidth - margin) {
                    left = Math.max(margin, window.innerWidth - pw - margin);
                }
            }

            blockPicker.style.left = Math.round(left) + 'px';
            blockPicker.style.top = Math.round(top) + 'px';
        }

        // ---- 打开 / 关闭 / 接受 ----
        function openBlockPicker(source, explicitOffset, point) {
            if (blockPickerState.visible) hideBlockPicker(false);
            if (searchState.visible) closeSearch();

            blockPickerState.source = source;
            blockPickerState.insertOffset = (typeof explicitOffset === 'number')
                ? explicitOffset
                : (codeInput.selectionStart || 0);
            blockPickerState.activeIndex = 0;
            blockPickerState.visible = true;

            blockPickerInput.value = '';
            blockPickerState.items = searchCompletions('');
            blockPicker.classList.add('show');
            renderBlockPickerList();
            positionBlockPicker(source, point);
            blockPickerInput.focus();
            blockPickerInput.select();
        }

        function hideBlockPicker(restoreFocus) {
            if (!blockPickerState.visible) return;
            if (restoreFocus === undefined) restoreFocus = true;
            blockPickerState.visible = false;
            blockPicker.classList.remove('show');
            blockPickerList.innerHTML = '';
            if (restoreFocus) {
                const off = blockPickerState.insertOffset;
                codeInput.focus();
                codeInput.setSelectionRange(off, off);
                updateCursorPosition();
            }
        }

        function acceptBlockFromPicker(item) {
            const offset = blockPickerState.insertOffset;
            const code = item.code;       // 原始模板，交给 insertCode 内部 renderCode
            const mode = item.mode;
            hideBlockPicker(false);
            codeInput.focus();
            codeInput.setSelectionRange(offset, offset);
            insertCode(code, mode, offset);
        }

        // ---- 浮层内交互 ----
        let pickerComposing = false;
        blockPickerInput.addEventListener('compositionstart', () => { pickerComposing = true; });
        blockPickerInput.addEventListener('compositionend', () => { pickerComposing = false; });

        blockPickerInput.addEventListener('input', () => {
            blockPickerState.items = searchCompletions(blockPickerInput.value);
            blockPickerState.activeIndex = 0;
            renderBlockPickerList();
        });

        blockPickerInput.addEventListener('keydown', (e) => {
            if (pickerComposing) return;      // 中文输入法组合期间不拦截
            const len = blockPickerState.items.length;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (len) {
                    blockPickerState.activeIndex = (blockPickerState.activeIndex + 1) % len;
                    updateBlockPickerActive();
                }
                return;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (len) {
                    blockPickerState.activeIndex = (blockPickerState.activeIndex - 1 + len) % len;
                    updateBlockPickerActive();
                }
                return;
            }
            if (e.key === 'Enter' || e.key === 'Tab') {
                e.preventDefault();
                if (len) acceptBlockFromPicker(blockPickerState.items[blockPickerState.activeIndex]);
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                hideBlockPicker();
                return;
            }
        });

        // 外部点击关闭（点编辑器也关：用户此时想编辑；Ctrl+点击会立即重新打开）
        document.addEventListener('mousedown', (e) => {
            if (!blockPickerState.visible) return;
            if (blockPicker.contains(e.target)) return;
            const btn = document.getElementById('blockPickerBtn');
            if (btn && btn.contains(e.target)) return;
            hideBlockPicker(false);
        });

        // ==================== 编辑器事件 ====================
        codeInput.addEventListener('input', () => {
            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
            syncScroll();
            if (searchState.visible) performSearch();
        });

        codeInput.addEventListener('scroll', () => {
            syncScroll();
            if (blockPickerState.visible && blockPickerState.source === 'keyboard') {
                positionBlockPicker('keyboard');
            }
        });
        codeInput.addEventListener('click', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                const offset = getOffsetFromPoint(e.clientX, e.clientY);
                openBlockPicker('ctrl-click', offset, { left: e.clientX, top: e.clientY + 4 });
                return;
            }
            updateCursorPosition();
        });
        codeInput.addEventListener('keyup', updateCursorPosition);
        codeInput.addEventListener('select', updateCursorPosition);

        window.addEventListener('resize', () => {
            syncScrollbarWidth();
            syncScroll();
            if (blockPickerState.visible && blockPickerState.source === 'keyboard') {
                positionBlockPicker('keyboard');
            }
        });

        codeInput.addEventListener('focus', syncScroll);

        codeInput.addEventListener('keydown', (e) => {
            // Ctrl+/ 唤起积木选择器（兼容 Slash 与小键盘除号，避免键盘布局差异导致 e.key 不同）
            const isSlashKey = e.key === '/' || e.code === 'Slash' || e.code === 'NumpadDivide';
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && isSlashKey) {
                e.preventDefault();
                e.stopPropagation();
                openBlockPicker('keyboard');
                return;
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                openSearch(false);
                return;
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'h') {
                e.preventDefault();
                openSearch(true);
                return;
            }
            if (e.key === 'Escape') {
                if (searchState.visible) {
                    closeSearch();
                    return;
                }
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                indentSelection(e.shiftKey ? -1 : 1);
                return;
            }
            if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                handleEnter();
                return;
            }
            if (e.key === '}' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                handleCloseBrace();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
                e.preventDefault();
                redo();
                return;
            }
        });

        codeInput.addEventListener('blur', () => {
            if (history.debounceTimer) {
                clearTimeout(history.debounceTimer);
                history.debounceTimer = null;
                pushHistory();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (blockPickerState.visible) return;   // 浮层优先，屏蔽全局 Ctrl+F/H
            // Ctrl+/ 全局兜底：按钮在顶部工具栏，焦点不在任何输入框时也应能唤起
            const isSlashKey = e.key === '/' || e.code === 'Slash' || e.code === 'NumpadDivide';
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && isSlashKey) {
                const ae = document.activeElement;
                const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
                if (!typing) {
                    e.preventDefault();
                    openBlockPicker('toolbar');
                }
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'f') {
                if (document.activeElement !== codeInput && document.activeElement !== searchInput) {
                    e.preventDefault();
                    openSearch(false);
                }
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'h') {
                if (document.activeElement !== codeInput && document.activeElement !== searchInput) {
                    e.preventDefault();
                    openSearch(true);
                }
            }
        });

        codeInput.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            codeInput.classList.add('drag-over');
        });
        codeInput.addEventListener('dragleave', () => {
            codeInput.classList.remove('drag-over');
        });
        codeInput.addEventListener('drop', (e) => {
            e.preventDefault();
            codeInput.classList.remove('drag-over');
            let payload;
            try {
                payload = JSON.parse(e.dataTransfer.getData('text/plain'));
            } catch {
                return;
            }
            if (!payload.code) return;
            const offset = getOffsetFromPoint(e.clientX, e.clientY);
            insertCode(payload.code, payload.mode, offset);
        });

        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => e.preventDefault());

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        // 积木选择器：工具栏入口（触屏兜底）
        document.getElementById('blockPickerBtn').addEventListener('click', () => {
            if (blockPickerState.visible) {
                hideBlockPicker();
                return;
            }
            openBlockPicker('toolbar');
        });

        document.getElementById('autoIndentBtn').addEventListener('click', () => {
            autoIndentSelection();
            codeInput.focus();
        });
        document.getElementById('indentBtn').addEventListener('click', () => {
            indentSelection(1);
            codeInput.focus();
        });
        document.getElementById('outdentBtn').addEventListener('click', () => {
            indentSelection(-1);
            codeInput.focus();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            codeInput.value = '';
            lastHighlightedText = null;
            updateHighlight();
            updateCursorPosition();
            pushHistoryImmediate();
            codeInput.focus();
        });

        document.getElementById('exampleBtn').addEventListener('click', () => {
            codeInput.value = `#include <stdio.h>
#include <math.h>

int main() {
    int x = 10;
    float pi = 3.14159;
    char grade = 'A';
    int numbers[5] = {10, 20, 30, 40, 50};
    float values[3] = {1.5, 2.5, 3.5};

    printf("x = %d\\n", x);
    printf("pi = %f\\n", pi);
    printf("grade: %c\\n", grade);
    printf("numbers[2]: %d\\n", numbers[2]);

    double r = sqrt(16);
    double p = pow(2, 3);
    int a = abs(-5);
    double s = sin(0.5);
    int m = max(3, 7);

    return 0;
}
`;
            updateHighlight();
            updateCursorPosition();
            pushHistoryImmediate();
            codeInput.focus();
            codeInput.setSelectionRange(codeInput.value.length, codeInput.value.length);
        });

        omitStdCheckbox.addEventListener('change', refreshBlockLabels);

        titleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                titleInput.blur();
            }
        });

        // ==================== 主题切换 ====================
        // 默认暗色；三态循环：dark → light → system → dark
        const THEME_KEY = 'app-theme-v1';
        const THEME_DEFAULT = 'dark';
        const THEME_ORDER = ['dark', 'light', 'system'];

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const mqlLight = window.matchMedia('(prefers-color-scheme: light)');

        function getThemePref() {
            try {
                const v = localStorage.getItem(THEME_KEY);
                return THEME_ORDER.includes(v) ? v : THEME_DEFAULT;
            } catch (e) {
                return THEME_DEFAULT;
            }
        }

        function resolveTheme(pref) {
            if (pref === 'system') return mqlLight.matches ? 'light' : 'dark';
            return pref;
        }

        function updateThemeButton(pref) {
            if (!themeToggleBtn) return;
            const map = {
                dark: { icon: 'moon', title: t('themeTitleDark') },
                light: { icon: 'sun', title: t('themeTitleLight') },
                system: { icon: 'monitor', title: t('themeTitleSystem') }
            };
            const cfg = map[pref] || map[THEME_DEFAULT];
            themeToggleBtn.innerHTML = `<svg class="icon"><use href="#icon-${cfg.icon}"/></svg>`;
            themeToggleBtn.title = cfg.title;
        }

        function applyTheme(pref) {
            document.documentElement.setAttribute('data-theme', resolveTheme(pref));
            try {
                localStorage.setItem(THEME_KEY, pref);
            } catch (e) { }
            updateThemeButton(pref);
        }

        function cycleTheme() {
            const cur = getThemePref();
            const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
            applyTheme(next);
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', cycleTheme);
        }

        // ==================== 语言切换 ====================
        (function initLangToggle() {
            const btn = document.getElementById('langToggleBtn');
            if (!btn) return;
            btn.addEventListener('click', () => {
                setLang(currentLang === 'zh' ? 'en' : 'zh');
            });
        })();

        // 系统主题变化时，仅在「跟随系统」模式下实时响应
        const onSystemThemeChange = () => {
            if (getThemePref() === 'system') {
                document.documentElement.setAttribute('data-theme', resolveTheme('system'));
            }
        };
        if (mqlLight.addEventListener) {
            mqlLight.addEventListener('change', onSystemThemeChange);
        } else if (mqlLight.addListener) {
            mqlLight.addListener(onSystemThemeChange);
        }

        updateThemeButton(getThemePref());

        // ==================== 初始化 ====================
        (function init() {
            const saved = loadFromStorage();
            BLOCKS = saved || JSON.parse(JSON.stringify(DEFAULT_BLOCKS));
            normalizeBlocksModes(BLOCKS);   // 旧的 localStorage 里可能是 'lc'

            renderBlocksPanel();
            setLang(getLangPref(), { persist: false });   // 应用界面语言（首帧即生效，不会闪）

            const defaultCode = `#include <stdio.h>

int main() {
    int x = 10;
    float pi = 3.14;
    char c = 'A';
    int arr[5] = {1, 2, 3, 4, 5};
    float farr[3] = {1.1, 2.2, 3.3};

    printf("Hello, World!\\n");
    printf("%d\\n", x);
    return 0;
}
`;
            codeInput.value = defaultCode;
            updateHighlight();

            history.stack = [{ text: defaultCode, caret: 0 }];
            history.index = 0;
            history.lastText = defaultCode;
            updateUndoRedoButtons();

            updateCursorPosition();
            applyLineNumberVisibility(true);
            codeInput.focus();
            codeInput.setSelectionRange(defaultCode.length, defaultCode.length);

            if (typeof Prism === 'undefined') {
                document.querySelector('.status-bar').insertAdjacentHTML('beforeend',
                    '<span style="color:var(--danger);">' + t('warnPrism') + '</span>');
            }
        })();
    </script>
</body>
</html>
