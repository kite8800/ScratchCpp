                    upBtn.title = '上移类别';
                    upBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveCategory(cat, -1);
                    });
                    reorderWrap.appendChild(upBtn);

                    const downBtn = document.createElement('button');
                    downBtn.className = 'cat-reorder-btn';
                    downBtn.innerHTML = iconSvg('arrow-down');
                    downBtn.title = '下移类别';
                    downBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        moveCategory(cat, 1);
                    });
                    reorderWrap.appendChild(downBtn);

                    header.appendChild(reorderWrap);
                } else {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'cat-add-btn';
                    addBtn.innerHTML = iconSvg('plus');
                    addBtn.title = '在此类别新增积木';
                    addBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openAddBlockModal(cat);
                    });
                    header.appendChild(addBtn);
                }

                header.addEventListener('click', () => {
                    cat.collapsed = !cat.collapsed;
                    catEl.classList.toggle('collapsed');
                    saveToStorage();
                });

                header.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    openCategoryEditor(cat);
                });

                catEl.appendChild(header);

                const body = document.createElement('div');
                body.className = 'category-body';

                const subKeys = Object.keys(cat.subgroups || {});
                if (subKeys.includes('none')) {
                    (cat.subgroups.none || []).forEach(item => body.appendChild(buildBlockElement(cat, 'none', item)));
                }
                subKeys.forEach(subKey => {
                    if (subKey === 'none') return;
                    const items = cat.subgroups[subKey] || [];
                    if (items.length === 0) return;

                    const label = document.createElement('div');
                    label.className = 'subgroup-label ' + getSubLabelClass(subKey);
                    label.textContent = getSubLabel(subKey);
                    body.appendChild(label);

                    items.forEach(item => body.appendChild(buildBlockElement(cat, subKey, item)));
                });

                catEl.appendChild(body);
                blocksScroll.appendChild(catEl);
            });
        }

        function refreshBlockLabels() {
            blocksScroll.querySelectorAll('.block').forEach(div => {
                const labelEl = div.querySelector('.block-label');
                if (!labelEl) return;
                const template = div.dataset.code;
                labelEl.textContent = renderCode(template.split('\n')[0]);
            });
        }

        function moveCategory(cat, dir) {
            const idx = BLOCKS.indexOf(cat);
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= BLOCKS.length) return;
            BLOCKS.splice(idx, 1);
            BLOCKS.splice(newIdx, 0, cat);
            saveToStorage();
            renderBlocksPanel();
        }

        function moveBlock(cat, sub, block, dir) {
            const arr = cat.subgroups[sub];
            if (!arr) return;
            const idx = arr.indexOf(block);
            const newIdx = idx + dir;
            if (newIdx < 0 || newIdx >= arr.length) return;
            arr.splice(idx, 1);
            arr.splice(newIdx, 0, block);
            saveToStorage();
            renderBlocksPanel();
        }

        // ==================== 积木编辑弹窗 ====================

        // ==================== 新增积木弹窗 ====================
        function openAddBlockModal(cat) {

        addBlockSaveBtn.addEventListener('click', () => {
            if (!addingBlockTo) return;
            const cat = findCategory(addingBlockTo.catId);
            if (!cat) { addBlockModal.classList.remove('show'); return; }

            const code = addBlockCode.value.trim();
            if (!code) {
                alert('请输入代码内容');
                return;

            const label = addBlockLabel.value.trim() || code.split('\n')[0];
            const mode = document.querySelector('input[name="addBlockMode"]:checked').value;

            let icon = addBlockIconInput.value.trim();
            if (!icon) icon = addBlockIconSelect.value;
            icon = icon.replace(/^fa-/, '');

            const selectedRadio = document.querySelector('input[name="addBlockSubRadio"]:checked').value;
            let sub;
            if (selectedRadio === 'custom') {
                const customName = addBlockCustomSub.value.trim();
                if (!customName) {
                    alert('请输入自定义子类别名');
                    return;
                }
                sub = customName;
            } else {
                sub = selectedRadio;
            }

            if (!cat.subgroups[sub]) {
                cat.subgroups[sub] = [];
            }

            const newItem = {
                id: genId('custom'),
                icon: icon,
                label,
                code,
                mode
            };
            cat.subgroups[sub].unshift(newItem);
            saveToStorage();
            renderBlocksPanel();
            addBlockModal.classList.remove('show');
            addingBlockTo = null;
        });

        addBlockCancelBtn.addEventListener('click', () => {
            addBlockModal.classList.remove('show');
            addingBlockTo = null;
        });

        addBlockModal.addEventListener('click', (e) => {
            if (e.target === addBlockModal) {
                addBlockModal.classList.remove('show');
                addingBlockTo = null;
            }
        });

        // ==================== 类别弹窗 ====================
        function openCategoryEditor(cat) {
            editingCategory = cat ? { catId: cat.id } : null;
            categoryModalTitle.textContent = cat ? '编辑类别' : '新增类别';
            categoryName.value = cat ? cat.category : '';
            const icon = cat ? (cat.icon || 'cube') : 'cube';
            const selectOptions = Array.from(categoryIconSelect.options).map(o => o.value);
            if (selectOptions.includes(icon)) {
                categoryIconSelect.value = icon;
                categoryIconInput.value = '';
            } else {
                categoryIconSelect.value = 'cube';
                categoryIconInput.value = icon;
            }
            categoryDeleteBtn.style.display = cat ? 'inline-flex' : 'none';
            categoryModal.classList.add('show');
            categoryName.focus();
        }

        categorySaveBtn.addEventListener('click', () => {
            const name = categoryName.value.trim();
            if (!name) {
                alert('请输入类别名');
                return;
            }
            let icon = categoryIconInput.value.trim();
            if (!icon) icon = categoryIconSelect.value;
            icon = icon.replace(/^fa-/, '');

            if (editingCategory) {
                const cat = findCategory(editingCategory.catId);
                if (cat) {
                    cat.category = name;
                    cat.icon = icon;
                }
            } else {
                const newCat = {
                    id: genId('cat'),
                    category: name,
                    icon: icon,
                    collapsed: false,
                    subgroups: { none: [], c: [], cpp: [] }
                };
                BLOCKS.unshift(newCat);
            }
            saveToStorage();
            renderBlocksPanel();
            categoryModal.classList.remove('show');
            editingCategory = null;
        });

        categoryCancelBtn.addEventListener('click', () => {
            categoryModal.classList.remove('show');
            editingCategory = null;
        });

        categoryDeleteBtn.addEventListener('click', () => {
            if (!editingCategory) return;
            const cat = findCategory(editingCategory.catId);
            if (!cat) return;
            if (!confirm(`确定删除类别「${cat.category}」吗？该类别下的所有积木也会一起删除。`)) return;
            const idx = BLOCKS.indexOf(cat);
            if (idx >= 0) BLOCKS.splice(idx, 1);
            saveToStorage();
            renderBlocksPanel();
            categoryModal.classList.remove('show');
            editingCategory = null;
        });

        categoryModal.addEventListener('click', (e) => {
            if (e.target === categoryModal) {
                categoryModal.classList.remove('show');
                editingCategory = null;
            }
        });

        // ==================== 面板顶部按钮 ====================
        document.getElementById('addCategoryBtn').addEventListener('click', () => {
            openCategoryEditor(null);
        });

        const reorderBtn = document.getElementById('reorderBtn');
        reorderBtn.addEventListener('click', () => {
            isReorderMode = !isReorderMode;
            reorderBtn.classList.toggle('active', isReorderMode);
            reorderBtn.innerHTML = isReorderMode
                ? iconSvg('check') + ' 完成'
                : iconSvg('sort') + ' 排序';
            renderBlocksPanel();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = JSON.stringify(BLOCKS, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `blocks-config-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            importFileInput.click();
        });

        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (!isValidBlockData(data)) {
                        throw new Error('结构错误：需为数组，每个分类含 category 和 subgroups（含 none/c/cpp 三个数组）');
                    }
                    pendingImportData = data;
                    importModeModal.classList.add('show');
                } catch (err) {
                    alert('导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            importFileInput.value = '';
        });

        importOverwriteBtn.addEventListener('click', () => {
            if (!pendingImportData) return;
            BLOCKS = pendingImportData;
            saveToStorage();
            renderBlocksPanel();
            importModeModal.classList.remove('show');
            pendingImportData = null;
            alert('导入成功（覆盖）！');
        });

        importIncrementalBtn.addEventListener('click', () => {
            if (!pendingImportData) return;
            mergeBlocks(pendingImportData);
            saveToStorage();
            renderBlocksPanel();
            importModeModal.classList.remove('show');
            pendingImportData = null;
            alert('导入成功（增量）！');
        });

        importCancelBtn.addEventListener('click', () => {
            importModeModal.classList.remove('show');
            pendingImportData = null;
        });

        importModeModal.addEventListener('click', (e) => {
            if (e.target === importModeModal) {
                importModeModal.classList.remove('show');
                pendingImportData = null;
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!confirm('确定恢复默认积木配置吗？当前的所有自定义（新增/编辑/删除/排序）都会丢失。')) return;
            BLOCKS = JSON.parse(JSON.stringify(DEFAULT_BLOCKS));
            saveToStorage();
            renderBlocksPanel();
        });

        // ==================== 编辑器事件 ====================
        codeInput.addEventListener('input', () => {
            updateHighlight();
            updateCursorPosition();
            schedulePushHistory();
            syncScroll();
            if (searchState.visible) performSearch();
        });

        codeInput.addEventListener('scroll', syncScroll);
        codeInput.addEventListener('click', updateCursorPosition);
        codeInput.addEventListener('keyup', updateCursorPosition);
        codeInput.addEventListener('select', updateCursorPosition);

        window.addEventListener('resize', () => {
            syncScrollbarWidth();
            syncScroll();
        });

        codeInput.addEventListener('focus', syncScroll);

        codeInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'f') {
                e.preventDefault();
                openSearch(false);
                return;
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'h') {
                e.preventDefault();
                openSearch(true);
                return;
            }
            if (e.key === 'Escape') {
                if (searchState.visible) {
                    closeSearch();
                    return;
                }
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                indentSelection(e.shiftKey ? -1 : 1);
                return;
            }
            if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                handleEnter();
                return;
            }
            if (e.key === '}' && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                handleCloseBrace();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
                e.preventDefault();
                redo();
                return;
            }
        });

        codeInput.addEventListener('blur', () => {
            if (history.debounceTimer) {
                clearTimeout(history.debounceTimer);
                history.debounceTimer = null;
                pushHistory();
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'f') {
                if (document.activeElement !== codeInput && document.activeElement !== searchInput) {
                    e.preventDefault();
                    openSearch(false);
                }
            }
            if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'h') {
                if (document.activeElement !== codeInput && document.activeElement !== searchInput) {
                    e.preventDefault();
                    openSearch(true);
                }
            }
        });

        codeInput.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            codeInput.classList.add('drag-over');
        });
        codeInput.addEventListener('dragleave', () => {
            codeInput.classList.remove('drag-over');
        });
        codeInput.addEventListener('drop', (e) => {
            e.preventDefault();
            codeInput.classList.remove('drag-over');
            let payload;
            try {
                payload = JSON.parse(e.dataTransfer.getData('text/plain'));
            } catch {
                return;
            }
            if (!payload.code) return;
            const offset = getOffsetFromPoint(e.clientX, e.clientY);
            insertCode(payload.code, payload.mode, offset);
        });

        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => e.preventDefault());

        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        document.getElementById('autoIndentBtn').addEventListener('click', () => {
            autoIndentSelection();
            codeInput.focus();
        });
        document.getElementById('indentBtn').addEventListener('click', () => {
            indentSelection(1);
            codeInput.focus();
        });
        document.getElementById('outdentBtn').addEventListener('click', () => {
            indentSelection(-1);
            codeInput.focus();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            codeInput.value = '';
            lastHighlightedText = null;
            updateHighlight();
            updateCursorPosition();
            pushHistoryImmediate();
            codeInput.focus();
        });

        document.getElementById('exampleBtn').addEventListener('click', () => {
            codeInput.value = `#include <stdio.h>
#include <math.h>

int main() {
    int x = 10;
    float pi = 3.14159;
    char grade = 'A';
    int numbers[5] = {10, 20, 30, 40, 50};
    float values[3] = {1.5, 2.5, 3.5};

    printf("x = %d\\n", x);
    printf("pi = %f\\n", pi);
    printf("grade: %c\\n", grade);
    printf("numbers[2]: %d\\n", numbers[2]);

    double r = sqrt(16);
    double p = pow(2, 3);
    int a = abs(-5);
    double s = sin(0.5);
    int m = max(3, 7);

    return 0;
}
`;
            updateHighlight();
            updateCursorPosition();
            pushHistoryImmediate();
            codeInput.focus();
            codeInput.setSelectionRange(codeInput.value.length, codeInput.value.length);
        });

        omitStdCheckbox.addEventListener('change', refreshBlockLabels);

        titleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                titleInput.blur();
            }
        });

        // ==================== 初始化 ====================
        (function init() {
            const saved = loadFromStorage();
            BLOCKS = saved || JSON.parse(JSON.stringify(DEFAULT_BLOCKS));

            renderBlocksPanel();

            const defaultCode = `#include <stdio.h>

int main() {
    int x = 10;
    float pi = 3.14;
    char c = 'A';
    int arr[5] = {1, 2, 3, 4, 5};
    float farr[3] = {1.1, 2.2, 3.3};

    printf("Hello, World!\\n");
    printf("%d\\n", x);
    return 0;
}
`;
            codeInput.value = defaultCode;
            updateHighlight();

            history.stack = [{ text: defaultCode, caret: 0 }];
            history.index = 0;
            history.lastText = defaultCode;
            updateUndoRedoButtons();

            updateCursorPosition();
            applyLineNumberVisibility(true);
            codeInput.focus();
            codeInput.setSelectionRange(defaultCode.length, defaultCode.length);

            if (typeof Prism === 'undefined') {
                document.querySelector('.status-bar').insertAdjacentHTML('beforeend',
                    '<span style="color:#ff7675;">⚠ Prism 未加载，语法高亮不可用（检查网络或 CDN）</span>');
            }
        })();
    </script>
</body>
</html>
